<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function Wave({ color, flip }) {
  const teeth = 16;
  const w = 1200, h = 40;
  const step = w / teeth;
  let d = `M0,${flip ? h : 0}`;
  for (let i = 0; i < teeth; i++) {
    const x1 = i * step + step / 2;
    const x2 = (i + 1) * step;
    const y1 = flip ? 0 : h;
    const y2 = flip ? h : 0;
    d += ` Q${x1},${y1} ${x2},${y2}`;
  }
  d += ` L${w},${h * 2 - (flip ? h : 0)} L0,${h * 2 - (flip ? h : 0)} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block', width: '100%', height: 40 }}>
      <path d={d} fill={color} />
    </svg>
  );
}

function PillButton({ children, bg, color = '#fff' }) {
  return (
    <button style={{ background: bg, color, border: 'none', padding: '16px 32px', borderRadius: 4, font: '700 0.8125rem var(--font-body)', letterSpacing: '0.08em', textTransform: 'uppercase', cursor: 'pointer' }}>
      {children}
    </button>
  );
}

function ServiceIcon({ type, stroke }) {
  const s = { stroke, fill: 'none', strokeWidth: 3 };
  if (type === 'cais') return <svg viewBox="0 0 100 100" style={{ width: 64, height: 64 }}><path d="M20 70 L50 25 L80 70" {...s} /></svg>;
  if (type === 'mar-aberto') return <svg viewBox="0 0 100 100" style={{ width: 64, height: 64 }}><circle cx="42" cy="50" r="24" {...s} /><circle cx="58" cy="50" r="24" {...s} /></svg>;
  if (type === 'oceano') return (
    <svg viewBox="0 0 100 100" style={{ width: 64, height: 64 }}>
      <path d="M20 40 Q50 20 80 40 Q50 60 20 40 Z" {...s} />
      <path d="M20 62 Q50 42 80 62 Q50 82 20 62 Z" {...s} />
    </svg>
  );
  return (
    <svg viewBox="0 0 100 100" style={{ width: 64, height: 64 }}>
      <circle cx="38" cy="38" r="20" {...s} />
      <circle cx="62" cy="38" r="20" {...s} />
      <circle cx="50" cy="62" r="20" {...s} />
    </svg>
  );
}

function MentoriaCard({ label, number, tag, type, bg, textured, textColor = '#fff', back }) {
  const [flipped, setFlipped] = useState(false);
  if (!back) {
    return (
      <div style={{ background: bg, backgroundImage: textured ? `url(../../assets/textures/${textured})` : 'none', backgroundSize: 'cover', backgroundPosition: 'center', borderRadius: 4, padding: 28, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', minHeight: 260, boxSizing: 'border-box' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div style={{ font: '700 2.125rem var(--font-display)', color: textColor }}>{label}</div>
          <div style={{ font: 'var(--text-body-s)', color: textColor, opacity: 0.7 }}>{number}</div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'center', margin: '16px 0' }}>
          <ServiceIcon type={type} stroke={textColor} />
        </div>
        <div style={{ font: '700 0.6875rem var(--font-body)', letterSpacing: '0.08em', textTransform: 'uppercase', color: textColor, lineHeight: 1.4 }}>{tag}</div>
      </div>
    );
  }
  return (
    <div style={{ perspective: 1200, minHeight: 260 }} onClick={() => setFlipped(!flipped)}>
      <div style={{ position: 'relative', height: 260, width: '100%', transformStyle: 'preserve-3d', transition: 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)', transform: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)', cursor: 'pointer' }}>
        <div style={{ position: 'absolute', inset: 0, backfaceVisibility: 'hidden', background: bg, backgroundImage: textured ? `url(../../assets/textures/${textured})` : 'none', backgroundSize: 'cover', backgroundPosition: 'center', borderRadius: 4, padding: 28, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', boxSizing: 'border-box' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div style={{ font: '700 2.125rem var(--font-display)', color: textColor }}>{label}</div>
            <div style={{ font: 'var(--text-body-s)', color: textColor, opacity: 0.7 }}>{number}</div>
          </div>
          <div style={{ display: 'flex', justifyContent: 'center', margin: '16px 0' }}>
            <ServiceIcon type={type} stroke={textColor} />
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
            <div style={{ font: '700 0.6875rem var(--font-body)', letterSpacing: '0.08em', textTransform: 'uppercase', color: textColor, lineHeight: 1.4 }}>{tag}</div>
            <div style={{ font: '700 0.6875rem var(--font-body)', letterSpacing: '0.06em', textTransform: 'uppercase', color: textColor, opacity: 0.8 }}>Saiba mais</div>
          </div>
        </div>
        <div style={{ position: 'absolute', inset: 0, backfaceVisibility: 'hidden', transform: 'rotateY(180deg)', background: bg, borderRadius: 4, padding: 28, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', boxSizing: 'border-box' }}>
          <div>
            <div style={{ font: '700 1.25rem var(--font-display)', color: textColor, marginBottom: 10 }}>{label}</div>
            <p style={{ font: 'var(--text-body-s)', color: textColor, opacity: 0.9, lineHeight: 1.45, margin: 0 }}>{back}</p>
          </div>
          <div style={{ font: '700 0.6875rem var(--font-body)', letterSpacing: '0.06em', textTransform: 'uppercase', color: textColor, opacity: 0.8 }}>Voltar</div>
        </div>
      </div>
    </div>
  );
}

function ComoFuncionaItem({ lead, rest }) {

}

function HeaderMenu() {
  const [open, setOpen] = useState(false);
  const links = [
    { href: '#para-quem', label: 'Para quem' },
    { href: '#mentorias', label: 'Mentorias' },
    { href: '#workshops', label: 'Workshops' },
    { href: '#sobre', label: 'Sobre' },
    { href: '#contato', label: 'Contato' },
    { href: 'https://balizcompany.substack.com/', label: 'Diário de Bordo', external: true },
    { href: 'mailto:susan@baliz.co', label: 'Começar agora' },
  ];
  return (
    <div style={{ position: 'relative' }}>
      <button onClick={() => setOpen(!open)} aria-label="Menu" style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 8 }}>
        <svg width="28" height="20" viewBox="0 0 28 20"><rect width="28" height="3" fill="var(--brand-primary)" /><rect y="8.5" width="28" height="3" fill="var(--brand-primary)" /><rect y="17" width="28" height="3" fill="var(--brand-primary)" /></svg>
      </button>
      {open && (
        <nav style={{ position: 'absolute', top: '100%', right: 0, background: 'var(--baliz-papel)', boxShadow: 'var(--shadow-raised)', borderRadius: 4, padding: 16, display: 'flex', flexDirection: 'column', gap: 12, minWidth: 200, zIndex: 20 }}>
          {links.map((l) => (
            <a key={l.label} href={l.href} target={l.external ? '_blank' : undefined} rel={l.external ? 'noopener' : undefined} onClick={() => setOpen(false)} style={{ font: '700 0.8125rem var(--font-body)', letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--brand-primary)', textDecoration: 'none' }}>{l.label}</a>
          ))}
        </nav>
      )}
    </div>
  );
}
